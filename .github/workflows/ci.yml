name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  test:
    name: Rust and Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
      - name: Check native fixture environment
        run: |
          uname -m
          cc --version
          cc -dumpfullversion
          rustc "+$RUST_TOOLCHAIN" --version
          python3 --version
          readelf --version
          test "$(uname -m)" = x86_64
          test "$(cc -dumpfullversion | cut -d. -f1)" = 13
      - name: Rust tests
        run: cargo "+$RUST_TOOLCHAIN" test --locked --all-targets
      - name: Python tests
        run: python3 -m unittest discover -s tools/tests

  style:
    name: Formatting and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust with style tools
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --no-self-update
      - name: Formatting
        run: cargo "+$RUST_TOOLCHAIN" fmt --all --check
      - name: Clippy
        run: cargo "+$RUST_TOOLCHAIN" clippy --locked --all-targets -- -D warnings
